name: 🐛 Bug Report
description: Segnala un bug riproducibile
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Grazie per la segnalazione! Compila i campi sotto.
  - type: textarea
    id: description
    attributes:
      label: Descrizione del bug
      description: Cosa ti aspettavi vs cosa è successo
      placeholder: Quando faccio X mi aspetto Y, invece succede Z
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Passi per riprodurre
      placeholder: |
        1. Apri Vega
        2. Dici "..."
        3. Vedi errore
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Versione Vega
      placeholder: e.g. 1.0.0
  - type: dropdown
    id: os
    attributes:
      label: Sistema Operativo
      options:
        - Windows 11
        - Windows 10
        - Linux
        - macOS
        - Altro
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log / Stack trace
      description: Output di `data/audit.log.jsonl` o `crash_report_*.txt` rilevanti
      render: shell
  - type: checkboxes
    id: privacy
    attributes:
      label: Conferma privacy
      options:
        - label: Ho rimosso dati personali sensibili dai log incollati
          required: true
