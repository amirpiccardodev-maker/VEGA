<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>V.E.G.A. - Avvio</title>
<link rel="icon" type="image/x-icon" href="../assets/vega.ico">
<link rel="shortcut icon" type="image/x-icon" href="../assets/vega.ico">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100vh; width: 100vw;
    background: radial-gradient(ellipse at center, #050a14 0%, #03060c 70%);
    color: #8ba4ff;
    font-family: "Segoe UI", "Consolas", monospace;
    overflow: hidden;
    display: flex; align-items: center; justify-content: center;
    text-align: center;
  }
  .grid {
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(139, 164, 255,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(139, 164, 255,0.05) 1px, transparent 1px);
    background-size: 40px 40px;
    mask-image: radial-gradient(ellipse at center, black 20%, transparent 80%);
    pointer-events: none;
  }
  .container { position: relative; z-index: 2; }
  .title {
    font-size: 56px;
    letter-spacing: 18px;
    font-weight: 200;
    text-shadow: 0 0 20px rgba(139, 164, 255,0.65), 0 0 40px rgba(139, 164, 255,0.2);
    animation: pulse 2s ease-in-out infinite;
    margin-bottom: 8px;
  }
  @keyframes pulse {
    0%, 100% { text-shadow: 0 0 20px rgba(139, 164, 255,0.65), 0 0 40px rgba(139, 164, 255,0.2); }
    50% { text-shadow: 0 0 30px #8ba4ff, 0 0 60px rgba(139, 164, 255,0.5); }
  }
  .sub {
    font-size: 11px;
    letter-spacing: 6px;
    color: rgba(139, 164, 255,0.55);
    margin-bottom: 40px;
  }
  .core {
    width: 90px; height: 90px;
    margin: 30px auto;
    border-radius: 50%;
    background: radial-gradient(circle, #8ba4ff 0%, rgba(139, 164, 255,0.15) 70%, transparent 100%);
    box-shadow: 0 0 40px rgba(139, 164, 255,0.65), 0 0 80px rgba(139, 164, 255,0.18);
    animation: corePulse 1.6s ease-in-out infinite;
    position: relative;
  }
  @keyframes corePulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.12); }
  }
  .ring {
    position: absolute;
    border-radius: 50%;
    border: 1px solid rgba(139, 164, 255,0.3);
    pointer-events: none;
  }
  .ring.r1 { width: 140px; height: 140px; top: -25px; left: -25px;
    animation: spin 8s linear infinite;
    border-top-color: #8ba4ff; border-right-color: transparent;
    border-bottom-color: transparent; border-left-color: transparent; }
  .ring.r2 { width: 200px; height: 200px; top: -55px; left: -55px;
    animation: spin 14s linear infinite reverse;
    border-bottom-color: #8ba4ff; border-top-color: transparent;
    border-right-color: transparent; border-left-color: transparent; }
  @keyframes spin { from { transform: rotate(0); } to { transform: rotate(360deg); } }

  /* Progress display */
  .percent {
    font-size: 64px;
    font-weight: 100;
    color: var(--cyan, #8ba4ff);
    text-shadow: 0 0 20px rgba(139, 164, 255,0.7);
    margin-top: 36px;
    font-family: "Consolas", monospace;
    line-height: 1;
  }
  .percent .sign {
    font-size: 28px;
    opacity: 0.5;
    margin-left: 4px;
  }
  .bar-container {
    width: 380px;
    max-width: 80vw;
    margin: 18px auto 14px;
    height: 4px;
    background: rgba(139, 164, 255,0.1);
    border-radius: 2px;
    overflow: hidden;
    position: relative;
  }
  .bar-fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, transparent, #8ba4ff);
    box-shadow: 0 0 10px rgba(139, 164, 255,0.7);
    transition: width 0.5s ease;
    border-radius: 2px;
  }
  .label {
    font-size: 11px;
    letter-spacing: 0.4em;
    color: rgba(139, 164, 255,0.65);
    text-transform: uppercase;
    min-height: 16px;
  }
</style>
</head>
<body>
<div class="grid"></div>
<div class="container">
  <div class="title">V.E.G.A.</div>
  <div class="sub">VOICE · EYES · GUIDANCE · AGENCY</div>
  <div class="core">
    <div class="ring r1"></div>
    <div class="ring r2"></div>
  </div>
  <div class="percent"><span id="pct">0</span><span class="sign">%</span></div>
  <div class="bar-container"><div class="bar-fill" id="bar"></div></div>
</div>
<script>
  const url = "http://localhost:5252";
  let displayedPct = 0;
  let targetPct = 0;
  let connected = false;
  const startTime = Date.now();

  // Smoothly animate percent number toward target
  function tick() {
    if (displayedPct < targetPct) {
      displayedPct = Math.min(targetPct, displayedPct + Math.max(1, (targetPct - displayedPct) * 0.15));
    }
    document.getElementById("pct").textContent = Math.round(displayedPct);
    document.getElementById("bar").style.width = Math.round(displayedPct) + "%";
    requestAnimationFrame(tick);
  }
  tick();

  async function poll() {
    try {
      const r = await fetch(url + "/api/state", { method: "GET", cache: "no-store", mode: "cors" });
      if (r.ok) {
        connected = true;
        const data = await r.json();
        const pct = Number(data.boot_progress || 0);
        if (pct > targetPct) targetPct = pct;

        // When server is fully ready, jump to 100 and redirect
        if (data.ready) {
          targetPct = 100;
          setTimeout(() => window.location.replace(url), 600);
          return;
        }
      }
    } catch (e) {
      // Server not yet listening - estimate progress from elapsed time
      const elapsed = (Date.now() - startTime) / 1000;
      // Estimate: 0-5s = 0-5% (imports), poi il valore reale dal server
      // Cap a 5 (< primo _boot_progress reale = 15) per non bloccare mai la barra
      const est = Math.min(5, elapsed);
      if (est > targetPct) targetPct = est;
    }
    setTimeout(poll, 800);
  }
  setTimeout(poll, 500);
</script>
</body>
</html>
